id: credential-scanning
category: security
priority: 10
updated: 2026-02-01
rules:
  - action: NEVER
    rule: "Provide default values for secrets or credentials in code"
  - action: ALWAYS
    rule: "Fail immediately with clear error if environment variable for secret is missing"
  - action: ALWAYS
    rule: "Use .env for local dev (git-ignored), .env.example for documentation"
  - action: NEVER
    rule: "Use fallback patterns like process.env.KEY || 'default'"
anti_patterns:
  - "Hardcoded API keys - embedding secrets directly in source code as string literals"
  - "Silent fallback to default credentials - using || operator with a default value that masks missing configuration"
  - "Empty string fallbacks - using process.env.SECRET || '' which allows code to run without valid credentials"
examples:
  wrong_silent_fallback: |
    // Bad: Falls back to hardcoded default
    const apiKey = process.env.API_KEY || "sk-default-dev-key";
    const dbPassword = process.env.DB_PASSWORD || "password123";

    // Bad: Empty string still allows code to run
    const secret = process.env.SECRET_TOKEN || "";

    // Bad: Template string with embedded default
    const authHeader = `Bearer ${process.env.TOKEN || "dev-token"}`;
  correct_fail_fast: |
    // Good: Fails immediately if missing
    function requireEnv(name) {
        const value = process.env[name];
        if (!value) {
            throw new Error(`${name} environment variable is required`);
        }
        return value;
    }

    const dbPassword = requireEnv('DB_PASSWORD');
    const apiKey = requireEnv('API_KEY');

    // Good: Fails during initialization, not at runtime
    class ConfigService {
        constructor() {
            this.apiKey = requireEnv('API_KEY');
            this.dbUrl = requireEnv('DATABASE_URL');
            this.jwtSecret = requireEnv('JWT_SECRET');
        }
    }
  env_file_pattern: |
    # .env (never commit this!)
    API_KEY=sk-local-development-key
    DB_PASSWORD=local-dev-password

    # .env.example (safe to commit)
    API_KEY=your-api-key-here
    DB_PASSWORD=your-database-password
context: |
  Hardcoded credentials in code lead to security breaches. Even "development" or "default"
  keys committed to repositories can be exposed when environment variables are not set properly
  in production. This standard was created after a real incident where a developer used the
  pattern process.env.API_KEY || "sk-dev-key". The environment variable was not set in
  production, the default key was exposed and used, resulting in 4 hours of emergency API key
  rotation, $237 in unauthorized API usage, and 8 hours of security incident overhead. The
  principle is simple: no credential is "just for development." Anything in code can end up
  in production. Applications must fail fast and loud when secrets are missing rather than
  silently falling back to defaults.
tags:
  - security
  - credential-scanning
  - secrets
  - environment-variables
